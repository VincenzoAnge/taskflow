<!DOCTYPE html>
<!-- Pagina di un progetto: board Kanban, chat e membri (logica in js/project.js) -->
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progetto - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container-xxl py-4">
    <a href="/dashboard.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <div id="errorBox" class="alert alert-danger d-none mt-3"></div>

    <!-- Intestazione del progetto -->
    <div id="projectHeader" class="card project-header overflow-hidden my-3 d-none">
      <div id="projectCover"></div>
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <div class="d-flex flex-wrap gap-1 mb-2" id="projectBadges"></div>
            <h2 class="mb-1" id="projectTitle"></h2>
            <p class="text-secondary mb-2" id="projectDescription"></p>
            <div class="mb-2" id="projectTechnologies"></div>
            <div class="small text-secondary d-flex align-items-center gap-2" id="projectOwner"></div>
          </div>
          <div class="d-flex flex-wrap gap-2" id="projectActions"></div>
        </div>
      </div>
    </div>

    <!-- Visibile a chi non è membro -->
    <div id="guestArea" class="d-none">
      <div class="empty-state py-5">
        <i class="bi bi-lock"></i>
        <span>Board e chat sono visibili solo ai membri del progetto.</span>
      </div>
    </div>

    <!-- Visibile ai membri -->
    <div id="memberArea" class="row g-4 d-none">
      <!-- Board Kanban -->
      <div class="col-xl-8">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <h3 class="section-title mb-0">Board</h3>
            <div class="small text-secondary">Trascina una card in un'altra colonna oppure usa il suo pulsante per cambiarne lo stato.</div>
          </div>
          <button class="btn btn-primary" id="newTaskBtn"><i class="bi bi-plus-lg"></i> Nuovo task</button>
        </div>
        <div class="row g-3" id="board">
            <div class="col-md-4">
              <div class="kanban-column" data-status="todo">
                <h6 class="kanban-title"><span class="kanban-dot dot-todo"></span> DA FARE <span class="kanban-count" id="count-todo">0</span></h6>
                <div id="col-todo"></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="kanban-column" data-status="doing">
                <h6 class="kanban-title"><span class="kanban-dot dot-doing"></span> IN CORSO <span class="kanban-count" id="count-doing">0</span></h6>
                <div id="col-doing"></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="kanban-column" data-status="done">
                <h6 class="kanban-title"><span class="kanban-dot dot-done"></span> COMPLETATO <span class="kanban-count" id="count-done">0</span></h6>
                <div id="col-done"></div>
              </div>
            </div>
        </div>
      </div>

      <!-- Colonna laterale: chat e membri -->
      <div class="col-xl-4">
        <div class="card mb-4">
          <div class="card-body">
            <h3 class="section-title"><i class="bi bi-chat-dots"></i> Chat del progetto</h3>
            <div class="chat-box mb-3" id="chatBox"></div>
            <form id="chatForm" class="input-group">
              <input type="text" class="form-control" id="chatInput" placeholder="Scrivi un messaggio..." autocomplete="off">
              <button class="btn btn-primary" type="submit" aria-label="Invia"><i class="bi bi-send"></i></button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h3 class="section-title"><i class="bi bi-people"></i> Membri</h3>
            <ul class="list-group list-group-flush member-list mb-3" id="membersList"></ul>
            <!-- Solo il proprietario può aggiungere membri -->
            <form id="memberForm" class="d-none">
              <label class="form-label" for="memberEmail">Aggiungi un membro</label>
              <div class="input-group">
                <input type="email" class="form-control" id="memberEmail" placeholder="Email dell'utente" required>
                <button class="btn btn-primary" type="submit">Aggiungi</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Finestra per creare o modificare un task -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="taskForm">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Nuovo task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-3">
            <label class="form-label" for="taskTitle">Titolo</label>
            <input type="text" class="form-control" id="taskTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="taskDescription">Descrizione</label>
            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="taskAssignee">Assegnato a</label>
              <select class="form-select" id="taskAssignee"></select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="taskDueDate">Scadenza</label>
              <input type="date" class="form-control" id="taskDueDate">
            </div>
            <div class="col-6">
              <label class="form-label" for="taskPriority">Priorità</label>
              <select class="form-select" id="taskPriority">
                <option value="low">Bassa</option>
                <option value="medium">Media</option>
                <option value="high">Alta</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="taskStatus">Stato</label>
              <select class="form-select" id="taskStatus">
                <option value="todo">Da fare</option>
                <option value="doing">In corso</option>
                <option value="done">Completato</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger me-auto d-none" id="deleteTaskBtn"><i class="bi bi-trash"></i> Elimina</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Finestra per modificare il progetto (solo proprietario) -->
  <div class="modal fade" id="editProjectModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="editProjectForm">
        <div class="modal-header">
          <h5 class="modal-title">Modifica progetto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="editTitle">Titolo</label>
            <input type="text" class="form-control" id="editTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="editDescription">Descrizione</label>
            <textarea class="form-control" id="editDescription" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="editCategory">Categoria</label>
              <select class="form-select" id="editCategory"></select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="editVisibility">Visibilità</label>
              <select class="form-select" id="editVisibility">
                <option value="public">Pubblico</option>
                <option value="private">Privato</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="editTechnologies">Tecnologie</label>
            <input type="text" class="form-control" id="editTechnologies" placeholder="node, express, mongodb">
            <div class="form-text">Separate da virgola.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="editCover">Immagine di copertina (URL, facoltativa)</label>
            <input type="url" class="form-control" id="editCover">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/project.js"></script>
</body>
</html>
