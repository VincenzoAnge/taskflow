<!DOCTYPE html>
<!-- Pagina di login (la logica è in js/auth.js, condiviso con register.html) -->
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div class="auth-box">
      <div class="text-center mb-4">
        <h2 class="mb-1">Bentornato</h2>
        <p class="text-secondary">Accedi per vedere i tuoi progetti.</p>
      </div>
      <div class="card">
        <div class="card-body p-4">
          <div id="authError" class="alert alert-danger d-none"></div>
          <form id="authForm" data-mode="login">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" autocomplete="email" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Accedi</button>
          </form>
        </div>
      </div>
      <p class="text-center text-secondary small mt-3">Non hai un account? <a href="/register.html">Registrati</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
