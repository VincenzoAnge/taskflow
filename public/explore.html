<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esplora progetti - TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <h2 class="mb-1">Esplora progetti</h2>
    <p class="text-muted mb-4">I progetti pubblici di TaskFlow. Entra in un progetto per partecipare.</p>

    <div class="card mb-4">
      <div class="card-body">
        <form id="filterForm" class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label" for="filterCategory">Categoria</label>
            <select class="form-select" id="filterCategory"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="filterTechnology">Tecnologia</label>
            <input type="text" class="form-control" id="filterTechnology" placeholder="es. node">
          </div>
          <div class="col-md-2">
            <label class="form-label" for="filterSort">Ordina</label>
            <select class="form-select" id="filterSort">
              <option value="newest">Più recenti</option>
              <option value="oldest">Meno recenti</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filtra</button>
          </div>
        </form>
      </div>
    </div>

    <div id="projects" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/explore.js"></script>
</body>
</html>
