<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esplora progetti - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <h2 class="page-title">Esplora progetti</h2>
    <p class="text-muted mb-4">I progetti pubblici di TaskFlow. Apri un progetto e premi "Partecipa" per entrare nel team.</p>

    <div class="card mb-3">
      <div class="card-body">
        <form id="filterForm" class="row g-3 align-items-end">
          <div class="col-md-5">
            <label class="form-label" for="filterSearch">Cerca</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="filterSearch" placeholder="Titolo o descrizione">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="filterTechnology">Tecnologia</label>
            <input type="text" class="form-control" id="filterTechnology" placeholder="es. node" list="techList">
            <datalist id="techList"></datalist>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="filterSort">Ordina</label>
            <select class="form-select" id="filterSort">
              <option value="newest">Più recenti</option>
              <option value="oldest">Meno recenti</option>
            </select>
          </div>
        </form>
        <div class="d-flex flex-wrap gap-2 mt-3" id="categoryChips"></div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted small" id="resultCount"></span>
      <button class="btn btn-link btn-sm text-decoration-none" id="resetFilters"><i class="bi bi-x-circle"></i> Azzera filtri</button>
    </div>

    <div id="projects" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/explore.js"></script>
</body>
</html>
