<!DOCTYPE html>
<!-- Dashboard personale: riepilogo, progetti e task assegnati (logica in js/dashboard.js) -->
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container-xxl py-4">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h2 id="welcome">Dashboard</h2>
        <p class="text-secondary mb-0">Qui trovi i tuoi progetti e i task assegnati a te.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#projectModal">
        <i class="bi bi-plus-lg"></i> Nuovo progetto
      </button>
    </div>

    <!-- Card riepilogative -->
    <div class="row row-cols-2 row-cols-lg-4 g-3 mb-4">
      <div class="col"><div class="card stat-card h-100"><div class="card-body">
        <div class="stat-icon bg-primary-subtle text-primary-emphasis"><i class="bi bi-folder"></i></div>
        <div><div class="stat-number" id="statProjects">0</div><div class="small text-secondary">Progetti</div></div>
      </div></div></div>
      <div class="col"><div class="card stat-card h-100"><div class="card-body">
        <div class="stat-icon bg-secondary-subtle text-secondary-emphasis"><i class="bi bi-circle"></i></div>
        <div><div class="stat-number" id="statTodo">0</div><div class="small text-secondary">Task da fare</div></div>
      </div></div></div>
      <div class="col"><div class="card stat-card h-100"><div class="card-body">
        <div class="stat-icon bg-warning-subtle text-warning-emphasis"><i class="bi bi-hourglass-split"></i></div>
        <div><div class="stat-number" id="statDoing">0</div><div class="small text-secondary">Task in corso</div></div>
      </div></div></div>
      <div class="col"><div class="card stat-card h-100"><div class="card-body">
        <div class="stat-icon bg-success-subtle text-success-emphasis"><i class="bi bi-check-circle"></i></div>
        <div><div class="stat-number" id="statDone">0</div><div class="small text-secondary">Task completati</div></div>
      </div></div></div>
    </div>

    <div class="row g-4">
      <!-- Progetti -->
      <div class="col-lg-8">
        <h3 class="section-title">I miei progetti</h3>
        <div id="createdProjects" class="row row-cols-1 row-cols-md-2 g-3 mb-4"></div>

        <h3 class="section-title">Progetti a cui partecipo</h3>
        <div id="memberProjects" class="row row-cols-1 row-cols-md-2 g-3"></div>
      </div>

      <!-- Task assegnati all'utente, ordinati per scadenza -->
      <div class="col-lg-4">
        <h3 class="section-title">I miei task <span class="text-secondary fw-normal small">(per scadenza)</span></h3>
        <div class="card">
          <ul class="list-group list-group-flush" id="myTasks"></ul>
        </div>
      </div>
    </div>
  </main>

  <!-- Finestra per creare un nuovo progetto -->
  <div class="modal fade" id="projectModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="projectForm">
        <div class="modal-header">
          <h5 class="modal-title">Nuovo progetto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="projectTitle">Titolo</label>
            <input type="text" class="form-control" id="projectTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="projectDescription">Descrizione</label>
            <textarea class="form-control" id="projectDescription" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="projectCategory">Categoria</label>
              <select class="form-select" id="projectCategory"></select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="projectVisibility">Visibilità</label>
              <select class="form-select" id="projectVisibility">
                <option value="public">Pubblico</option>
                <option value="private">Privato</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="projectTechnologies">Tecnologie</label>
            <input type="text" class="form-control" id="projectTechnologies" placeholder="node, express, mongodb">
            <div class="form-text">Separate da virgola.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="projectCover">Immagine di copertina (URL, facoltativa)</label>
            <input type="url" class="form-control" id="projectCover">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Crea progetto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
