<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrati - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-5 d-flex align-items-center">
    <div class="card auth-card">
        <div class="auth-side">
          <h2 class="mb-3">Crea il tuo spazio di lavoro</h2>
          <ul class="list-unstyled mb-0">
            <li><i class="bi bi-kanban"></i> <span>Board Kanban per organizzare i task</span></li>
            <li><i class="bi bi-chat-dots"></i> <span>Chat e notifiche in tempo reale</span></li>
            <li><i class="bi bi-people"></i> <span>Lavora insieme al tuo team</span></li>
          </ul>
        </div>
        <div class="auth-form">
          <h3 class="mb-1">Crea il tuo account</h3>
          <p class="text-muted mb-4">Ci vuole meno di un minuto.</p>
          <div id="authError" class="alert alert-danger d-none"></div>
          <form id="authForm" data-mode="register">
            <div class="mb-3">
              <label class="form-label" for="name">Nome</label>
              <input type="text" class="form-control" id="name" autocomplete="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" minlength="6" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePassword" aria-label="Mostra password"><i class="bi bi-eye"></i></button>
              </div>
              <div class="form-text">Almeno 6 caratteri.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Registrati</button>
          </form>
          <p class="text-center text-muted small mt-4 mb-0">
            Hai già un account? <a href="/login.html">Accedi</a>
          </p>
        </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
