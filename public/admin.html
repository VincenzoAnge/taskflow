<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <h2 class="mb-4"><i class="bi bi-shield-lock"></i> Pannello amministratore</h2>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#usersTab">Utenti</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#projectsTab">Progetti</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="usersTab">
        <div class="card"><div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Stato</th><th>Registrato il</th><th></th></tr>
            </thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div></div>
      </div>

      <div class="tab-pane fade" id="projectsTab">
        <div class="card"><div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr><th>Titolo</th><th>Proprietario</th><th>Categoria</th><th>Visibilità</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody id="projectsTable"></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
