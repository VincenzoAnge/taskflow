<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='4.5' height='18' rx='1.5' fill='white'/%3E%3Crect x='13.75' y='7' width='4.5' height='12' rx='1.5' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <h2 class="page-title"><i class="bi bi-shield-lock text-primary"></i> Pannello amministratore</h2>
    <p class="text-muted mb-4">Gestisci gli utenti e i progetti della piattaforma.</p>

    <div class="row row-cols-2 row-cols-lg-4 g-3 mb-4">
      <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon tint-indigo"><i class="bi bi-people"></i></div>
        <div><div class="stat-number" id="statUsers">0</div><div class="text-muted small">Utenti</div></div>
      </div></div></div>
      <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon tint-rose"><i class="bi bi-person-slash"></i></div>
        <div><div class="stat-number" id="statBlocked">0</div><div class="text-muted small">Bloccati</div></div>
      </div></div></div>
      <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon tint-sky"><i class="bi bi-folder"></i></div>
        <div><div class="stat-number" id="statProjectsAdmin">0</div><div class="text-muted small">Progetti</div></div>
      </div></div></div>
      <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon tint-amber"><i class="bi bi-archive"></i></div>
        <div><div class="stat-number" id="statArchived">0</div><div class="text-muted small">Archiviati</div></div>
      </div></div></div>
    </div>

    <div class="card">
      <div class="card-header bg-transparent d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#usersTab">Utenti</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#projectsTab">Progetti</button>
          </li>
        </ul>
        <div class="input-group input-group-sm search-box mb-2">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" id="adminSearch" placeholder="Cerca per nome, email o titolo">
        </div>
      </div>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="usersTab">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Stato</th><th>Registrato il</th><th></th></tr>
              </thead>
              <tbody id="usersTable"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-pane fade" id="projectsTab">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr><th>Titolo</th><th>Proprietario</th><th>Categoria</th><th>Visibilità</th><th>Stato</th><th></th></tr>
              </thead>
              <tbody id="projectsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
